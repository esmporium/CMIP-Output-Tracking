[project]
authors = [
    { name = "Anna Zehrung", email = "anna.zehrung@unimelb.edu.au"},
]
requires-python = ">=3.10"
dependencies = [
    "pre-commit>=3.3.1",
    "jupyterlab>=4.0.0",
    "jupytext>=1.15.2",
    # What the daily search job itself needs
    "esmporium",
    "pandas>=2.2.0",  # pin based on minimum supported python version
    "python-dotenv>=1.0.0",
]
name = "local"
version = "0.1.0"
description = "Tracking the availability of CMIP data retrieved from ESGF"
readme = "README.md"

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "src/local"
]

[tool.uv]
package = true

[tool.uv.sources]
esmporium = { git = "https://github.com/esmporium/esmporium.git", rev = "server-tracking-v1" }

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "D",
    "PL",
    "TRY",
    "NPY",
    "RUF",
    "UP",
    "S",
]
unfixable = [ ]
ignore = [
    "D200",
    "D400",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
