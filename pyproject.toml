[project]
authors = [
    { name = "Anna Zehrung", email = "anna.zehrung@unimelb.edu.au"},
]
requires-python = ">=3.10"
dependencies = [
    "pre-commit>=3.3.1",
    "jupyterlab>=4.0.0",
    "jupytext>=1.15.2",
    # What the daily search job itself needs
    "esmporium",
    "pandas>=2.2.0",  # pin based on minimum supported python version
    "python-dotenv>=1.0.0",
]
name = "local"
version = "0.1.0"
description = "Tracking the availability of CMIP data retrieved from ESGF"
readme = "README.md"

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "src/local"
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    # `file_regression`, i.e. the checked-in copies of the morning email under
    # `tests/regression`. Accept a deliberate layout change with
    # `uv run pytest tests/regression --force-regen`.
    "pytest-regressions>=2.11.0",
]

[tool.uv]
package = true

[tool.uv.sources]
esmporium = { git = "https://github.com/esmporium/esmporium.git", rev = "a296d9c05b6e8967c7d1dd2f1527a2387cd8e65c" }

[tool.pytest.ini_options]
addopts = [
    # So that test modules are imported by their full path rather than inserted
    # on `sys.path`. Without it, `tests/` and its subdirectories would need
    # `__init__.py` files, and two test files sharing a basename would clash.
    "--import-mode=importlib",
]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "D",
    "PL",
    "TRY",
    "NPY",
    "RUF",
    "UP",
    "S",
]
unfixable = [ ]
ignore = [
    "D200",
    "D400",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
# Tests say what they check in their name and their comments, `assert` is the
# whole point of them, and a magic number in an assertion is the expected value.
"test*.py" = [
    "D",
    "S101",
    "PLR2004",
]
"scripts/*" = [
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
